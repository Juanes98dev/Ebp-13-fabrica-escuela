databases:
  - name: bancox-postgres
    databaseName: bancox
    plan: free

services:
  - type: web
    name: bancox-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: bancox-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bancox-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: bancox-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: bancox-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bancox-postgres
          property: password
      - key: DB_SSLMODE
        value: require
      - key: FRONTEND_URL
        sync: false
      - key: GESTOR_PASSWORD
        sync: false
      - key: SESSION_IDLE_MINUTES
        value: "10"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: bancox-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
